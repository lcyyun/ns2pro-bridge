<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NS2Pro Bridge Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1017;
      --panel: #151a23;
      --panel-2: #1b2230;
      --line: #2b3445;
      --text: #eef3ff;
      --muted: #98a5bb;
      --red: #ff5757;
      --blue: #4da3ff;
      --green: #52d273;
      --amber: #f2b84b;
      --bad: #ff6b7f;
      --ok: #54d58a;
      --radius: 8px;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #202838;
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #516179; background: #283143; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button.primary { background: #2e5f9f; border-color: #4480ca; }
    button.danger { background: #56303a; border-color: #8a4351; }
    button.good { background: #28513a; border-color: #3f7d57; }
    button.icon { width: 38px; padding: 0; }

    input[type="number"], input[type="text"], select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0f141d;
      color: var(--text);
      padding: 0 10px;
      min-width: 0;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue);
    }

    .app {
      width: min(1380px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions, .row, .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
      align-items: start;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 14px;
      min-width: 0;
    }

    .span-12 { grid-column: span 12; }
    .span-6 { grid-column: span 6; }
    .span-4 { grid-column: span 4; }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 10px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #101722;
      color: var(--muted);
      padding: 0 9px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .dot.warn { background: var(--amber); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .mode-btn {
      min-height: 44px;
      font-weight: 700;
    }

    .mode-btn.active[data-mode="nintendo"] { border-color: var(--red); background: #4a2028; }
    .mode-btn.active[data-mode="dualsense"] { border-color: var(--blue); background: #1d3c66; }
    .mode-btn.active[data-mode="xinput"] { border-color: var(--green); background: #1c4730; }
    .mode-btn.pending { box-shadow: inset 0 0 0 2px var(--amber); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 12px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .stick-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stick {
      aspect-ratio: 1;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), #344055 50%, transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), #344055 50%, transparent calc(50% + 1px)),
        #101722;
      position: relative;
      overflow: hidden;
    }

    .stick::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid #344055;
      border-radius: 50%;
    }

    .stick-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(77, 163, 255, .18);
      left: 50%;
      top: 50%;
      z-index: 1;
    }

    .stick-title {
      position: absolute;
      left: 10px;
      top: 8px;
      color: var(--muted);
      font-size: 12px;
      z-index: 1;
    }

    .button-map {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .key {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101722;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 12px;
      line-height: 1;
    }

    .key.on {
      border-color: var(--amber);
      background: #4f3a1c;
      color: #ffe1a0;
    }

    .raw-command {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }

    pre {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #090d13;
      color: #c8d4e8;
      padding: 10px;
      min-height: 260px;
      max-height: 460px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.45 Consolas, "Cascadia Mono", monospace;
    }

    .notice {
      border-left: 3px solid var(--amber);
      padding: 9px 10px;
      background: #1c1a13;
      color: #e8d29e;
      font-size: 13px;
      line-height: 1.45;
      border-radius: 0 7px 7px 0;
      margin-top: 10px;
    }

    @media (max-width: 980px) {
      .topbar, .layout { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-6, .span-4 { grid-column: span 12; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .app { width: min(100vw - 18px, 1380px); padding-top: 10px; }
      .metric-grid, .form-grid, .stick-wrap, .segmented { grid-template-columns: 1fr; }
      .button-map { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .raw-command { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>NS2Pro Bridge Console</h1>
        <div class="subtitle" id="deviceLine">未连接 WebHID 设备</div>
      </div>
      <div class="actions">
        <span class="pill"><span id="hidDot" class="dot"></span><span id="hidState">closed</span></span>
        <button id="connectBtn" class="primary">连接</button>
        <button id="reuseBtn">复用</button>
        <button id="refreshBtn" disabled>刷新</button>
        <button id="saveBtn" disabled>保存</button>
        <button id="restartBtn" class="danger" disabled>重启USB</button>
      </div>
    </div>

    <section class="layout">
      <div class="grid">
        <section class="panel span-12">
          <h2>状态</h2>
          <div class="metric-grid">
            <div class="metric">
              <div class="label">USB 模式</div>
              <div class="value" id="usbMode">--</div>
              <div class="small" id="usbDetail">--</div>
            </div>
            <div class="metric">
              <div class="label">BLE</div>
              <div class="value" id="bleState">--</div>
              <div class="small" id="bleDetail">--</div>
            </div>
            <div class="metric">
              <div class="label">电量</div>
              <div class="value" id="batteryValue">--</div>
              <div class="small" id="batteryDetail">--</div>
            </div>
            <div class="metric">
              <div class="label">震动</div>
              <div class="value" id="rumbleState">--</div>
              <div class="small" id="rumbleDetail">--</div>
            </div>
          </div>
        </section>

        <section class="panel span-6">
          <h2>输出风格</h2>
          <div class="segmented">
            <button class="mode-btn" data-mode="nintendo">Nintendo</button>
            <button class="mode-btn" data-mode="dualsense">DualSense</button>
            <button class="mode-btn" data-mode="xinput">XInput</button>
          </div>
          <div class="notice">切换模式只写入当前 USB 风格；保存后重启 USB 才会按新 VID/PID 重新枚举。DualSense/XInput 重新枚举后可能不再暴露管理 HID，必要时用 BOOT 双击切回。</div>
        </section>

        <section class="panel span-6">
          <h2>USB 设置</h2>
          <div class="form-grid">
            <div class="field">
              <label for="rateInput">报告率 Hz</label>
              <input id="rateInput" type="number" min="1" max="1000" step="1" value="250">
            </div>
            <div class="field">
              <label for="scaleInput">震动缩放 %</label>
              <input id="scaleInput" type="number" min="0" max="100" step="1" value="60">
            </div>
            <div class="field">
              <label for="holdInput">保持 ms</label>
              <input id="holdInput" type="number" min="20" max="2000" step="10" value="140">
            </div>
            <div class="field">
              <label for="tickInput">刷新 ms</label>
              <input id="tickInput" type="number" min="4" max="100" step="1" value="12">
            </div>
          </div>
          <div class="toggles">
            <label class="toggle"><input id="parseToggle" type="checkbox" checked> Web 解析</label>
            <label class="toggle"><input id="rawToggle" type="checkbox"> Raw 透传</label>
            <label class="toggle"><input id="autoRefreshToggle" type="checkbox" checked> 低频刷新</label>
          </div>
          <div class="button-row" style="margin-top:12px">
            <button id="applyUsbBtn" disabled>应用USB</button>
            <button id="applyRumbleBtn" disabled>应用震动</button>
            <button id="rumbleOnBtn" class="good" disabled>震动开</button>
            <button id="rumbleOffBtn" disabled>震动关</button>
          </div>
        </section>

        <section class="panel span-6">
          <h2>BLE 控制</h2>
          <div class="button-row">
            <button data-cmd="ns2 scan" disabled>扫描</button>
            <button data-cmd="ns2 pair" disabled>配对</button>
            <button data-cmd="ns2 reconnect" disabled>重连</button>
            <button data-cmd="ns2 disconnect" disabled>断开</button>
            <button data-cmd="ns2 forget" class="danger" disabled>忘记</button>
            <button data-cmd="ns2 auto on" disabled>自动开</button>
            <button data-cmd="ns2 auto off" disabled>自动关</button>
          </div>
        </section>

        <section class="panel span-6">
          <h2>震动测试</h2>
          <div class="button-row">
            <button data-cmd="rumble test left" disabled>左</button>
            <button data-cmd="rumble test right" disabled>右</button>
            <button data-cmd="rumble test both" disabled>双</button>
            <button data-cmd="rumble test click" disabled>Click</button>
            <button data-cmd="rumble stop" class="danger" disabled>停止</button>
          </div>
          <div class="form-grid" style="margin-top:12px">
            <div class="field">
              <label for="manualLeft">左/重</label>
              <input id="manualLeft" type="number" min="0" max="255" value="120">
            </div>
            <div class="field">
              <label for="manualRight">右/轻</label>
              <input id="manualRight" type="number" min="0" max="255" value="120">
            </div>
            <div class="field">
              <label for="manualHold">时间 ms</label>
              <input id="manualHold" type="number" min="20" max="2000" value="500">
            </div>
            <button id="manualRumbleBtn" disabled>发送</button>
          </div>
        </section>

        <section class="panel span-12">
          <h2>输入</h2>
          <div class="stick-wrap">
            <div class="stick" id="leftStick"><div class="stick-title" id="leftStickText">L 2048 / 2048</div><div class="stick-dot" id="leftDot"></div></div>
            <div class="stick" id="rightStick"><div class="stick-title" id="rightStickText">R 2048 / 2048</div><div class="stick-dot" id="rightDot"></div></div>
          </div>
          <div class="button-map" id="buttonMap" style="margin-top:12px"></div>
          <div class="small" id="inputDetail">--</div>
        </section>
      </div>

      <aside class="grid">
        <section class="panel span-12">
          <h2>原始命令</h2>
          <div class="raw-command">
            <input id="commandInput" type="text" value="usb status">
            <button id="sendBtn" disabled>发送</button>
          </div>
          <div class="button-row" style="margin-top:10px">
            <button data-quick="usb status" disabled>USB</button>
            <button data-quick="status" disabled>BLE</button>
            <button data-quick="motion status" disabled>输入</button>
            <button data-quick="rumble config" disabled>震动</button>
            <button data-quick="settings status" disabled>设置</button>
          </div>
        </section>

        <section class="panel span-12">
          <h2>日志</h2>
          <pre id="log"></pre>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const REPORT_ID = 0x7f;
    const INPUT_REPORT_ID = 0x05;
    const SET_MAGIC = "Y7HID1";
    const REPLY_MAGIC = "Y7HRS1";
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const $ = (id) => document.getElementById(id);

    const baseFilters = [
      { vendorId: 0x057e, productId: 0x2069 },
      { vendorId: 0x045e, productId: 0x028e },
      { vendorId: 0x054c, productId: 0x0ce6 },
      { vendorId: 0x303a, productId: 0x1001 },
      { vendorId: 0x24ae, productId: 0x185a },
    ];
    const managerFilters = baseFilters.map((filter) => ({ ...filter, usagePage: 0xff00, usage: 0x01 }));

    const buttonNames = ["B", "A", "Y", "X", "R", "ZR", "+", "RS", "D↓", "D→", "D←", "D↑", "L", "ZL", "-", "LS", "Home", "Cap", "GR", "GL", "C"];
    let device = null;
    let commandChain = Promise.resolve();
    let refreshTimer = 0;
    let reconnecting = false;
    let lastReconnectAttempt = 0;
    let currentMode = "";
    let pendingMode = "";
    let restartRequired = false;
    let liveInputCount = 0;
    let liveInputStartMs = 0;
    let lastLiveInputMs = 0;
    let pendingLiveInput = null;
    let liveFrameQueued = false;

    function log(text) {
      const el = $("log");
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${text}\n` + el.textContent;
      if (el.textContent.length > 24000) {
        el.textContent = el.textContent.slice(0, 24000);
      }
    }

    function setText(id, text) {
      $(id).textContent = text;
    }

    function boolText(value) {
      return value ? "yes" : "no";
    }

    function number(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function readLe32(data, offset) {
      return (data[offset] |
        (data[offset + 1] << 8) |
        (data[offset + 2] << 16) |
        (data[offset + 3] << 24)) >>> 0;
    }

    function unpack12X(data, offset) {
      return clamp(data[offset] | ((data[offset + 1] & 0x0f) << 8), 0, 4095);
    }

    function unpack12Y(data, offset) {
      return clamp(((data[offset + 1] >> 4) & 0x0f) | (data[offset + 2] << 4), 0, 4095);
    }

    function buttonsFromNintendoReport(data) {
      let buttons = 0;
      const set = (bit, pressed) => {
        if (pressed) buttons |= (1 << bit);
      };
      set(2, (data[4] & 0x01) !== 0);  // Y
      set(3, (data[4] & 0x02) !== 0);  // X
      set(0, (data[4] & 0x04) !== 0);  // B
      set(1, (data[4] & 0x08) !== 0);  // A
      set(4, (data[4] & 0x40) !== 0);  // R
      set(5, (data[4] & 0x80) !== 0);  // ZR
      set(14, (data[5] & 0x01) !== 0); // -
      set(6, (data[5] & 0x02) !== 0);  // +
      set(7, (data[5] & 0x04) !== 0);  // RS
      set(15, (data[5] & 0x08) !== 0); // LS
      set(16, (data[5] & 0x10) !== 0); // Home
      set(17, (data[5] & 0x20) !== 0); // Capture
      set(20, (data[5] & 0x40) !== 0); // C
      set(8, (data[6] & 0x01) !== 0);  // DDown
      set(11, (data[6] & 0x02) !== 0); // DUp
      set(9, (data[6] & 0x04) !== 0);  // DRight
      set(10, (data[6] & 0x08) !== 0); // DLeft
      set(12, (data[6] & 0x40) !== 0); // L
      set(13, (data[6] & 0x80) !== 0); // ZL
      set(18, (data[7] & 0x01) !== 0); // GR
      set(19, (data[7] & 0x02) !== 0); // GL
      return buttons;
    }

    function setEnabled(opened) {
      for (const el of document.querySelectorAll("button[disabled], button[data-cmd], button[data-quick], .mode-btn, #refreshBtn, #saveBtn, #restartBtn, #applyUsbBtn, #applyRumbleBtn, #rumbleOnBtn, #rumbleOffBtn, #manualRumbleBtn, #sendBtn")) {
        if (el.id === "connectBtn" || el.id === "reuseBtn") continue;
        el.disabled = !opened;
      }
      $("connectBtn").disabled = opened;
    }

    function setHidState(opened) {
      $("hidDot").className = `dot ${opened ? "ok" : "bad"}`;
      setText("hidState", opened ? "open" : "closed");
      const label = device ? `${device.productName || "HID"} VID ${device.vendorId.toString(16).padStart(4, "0")} PID ${device.productId.toString(16).padStart(4, "0")}` : "未连接 WebHID 设备";
      setText("deviceLine", label);
      setEnabled(opened);
    }

    function hasManagerFeature(hidDevice) {
      return (hidDevice.collections || []).some((collection) => {
        const usageMatches = collection.usagePage === 0xff00 || collection.usagePage === 65280;
        const featureMatches = (collection.featureReports || []).some((report) => report.reportId === REPORT_ID);
        return usageMatches || featureMatches;
      });
    }

    function isKnownDevice(hidDevice) {
      return baseFilters.some((filter) => filter.vendorId === hidDevice.vendorId && filter.productId === hidDevice.productId);
    }

    function deviceScore(hidDevice) {
      let score = 0;
      if (hasManagerFeature(hidDevice)) score += 100;
      if (isKnownDevice(hidDevice)) score += 20;
      if ((hidDevice.productName || "").includes("HID")) score += 5;
      return score;
    }

    function chooseManagerDevice(devices) {
      const known = devices.filter(isKnownDevice);
      const pool = known.length ? known : devices;
      return pool
        .slice()
        .sort((a, b) => deviceScore(b) - deviceScore(a))[0] || null;
    }

    function orderedManagerCandidates(devices) {
      const known = devices.filter(isKnownDevice);
      const pool = known.length ? known : devices;
      return pool.slice().sort((a, b) => deviceScore(b) - deviceScore(a));
    }

    function hasMagic(data, base) {
      if (data.length < base + REPLY_MAGIC.length) return false;
      for (let i = 0; i < REPLY_MAGIC.length; i++) {
        if (data[base + i] !== REPLY_MAGIC.charCodeAt(i)) return false;
      }
      return true;
    }

    async function sendCommandNow(command, silent = false) {
      if (!device || !device.opened) throw new Error("WebHID 未连接");
      const trimmed = command.trim();
      const body = encoder.encode(SET_MAGIC + trimmed);
      if (body.length > 63) throw new Error("命令过长");

      const payload = new Uint8Array(63);
      payload.set(body);
      await device.sendFeatureReport(REPORT_ID, payload);

      let total = -1;
      let received = 0;
      let result = new Uint8Array(1024);
      for (let attempt = 0; attempt < 32; attempt++) {
        const view = await device.receiveFeatureReport(REPORT_ID);
        const data = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
        const base = data[0] === REPORT_ID && hasMagic(data, 1) ? 1 : 0;
        if (!hasMagic(data, base)) throw new Error("坏回复 magic");

        total = data[base + 6] | (data[base + 7] << 8);
        const offset = data[base + 8] | (data[base + 9] << 8);
        const chunkLen = data[base + 10];
        if (total > result.length) {
          const grown = new Uint8Array(total);
          grown.set(result);
          result = grown;
        }
        result.set(data.slice(base + 11, base + 11 + chunkLen), offset);
        received = Math.max(received, offset + chunkLen);
        if (total >= 0 && received >= total) break;
      }
      if (total < 0 || received < total) throw new Error("回复不完整");

      const text = decoder.decode(result.slice(0, total));
      if (!silent) log(`> ${trimmed}\n${text}`);
      try {
        return JSON.parse(text);
      } catch {
        return { ok: false, raw: text };
      }
    }

    function sendCommand(command, silent = false) {
      commandChain = commandChain
        .catch(() => {})
        .then(() => sendCommandNow(command, silent));
      return commandChain;
    }

    async function openDevice(nextDevice, validate = true) {
      if (!nextDevice) return;
      device = nextDevice;
      if (!device.opened) await device.open();
      liveInputCount = 0;
      liveInputStartMs = performance.now();
      lastLiveInputMs = 0;
      device.removeEventListener("inputreport", handleInputReport);
      device.addEventListener("inputreport", handleInputReport);
      device.addEventListener("disconnect", () => {
        log("设备断开");
        setHidState(false);
      });
      setHidState(true);
      if (validate) {
        try {
          const usb = await sendCommand("usb status", true);
          if (usb.ok) applyUsbStatus(usb);
        } catch (error) {
          try { await device.close(); } catch {}
          setHidState(false);
          throw new Error(`不是管理 HID 或 feature 不可用: ${error.message}`);
        }
      }
      await refreshAll(false, true);
    }

    async function connect() {
      try {
        let devices = await navigator.hid.requestDevice({ filters: managerFilters });
        if (!devices.length) {
          devices = await navigator.hid.requestDevice({ filters: baseFilters });
        }
        const selected = chooseManagerDevice(devices);
        if (selected) await openDevice(selected);
      } catch (error) {
        log(`连接失败: ${error.message}`);
      }
    }

    async function reuse(silent = false) {
      try {
        const devices = await navigator.hid.getDevices();
        const candidates = orderedManagerCandidates(devices);
        if (!candidates.length) {
          if (!silent) log("没有可复用的授权设备");
          return;
        }
        let lastError = null;
        for (const candidate of candidates) {
          try {
            await openDevice(candidate);
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("没有可用的管理 HID");
      } catch (error) {
        if (!silent) log(`复用失败: ${error.message}`);
      }
    }

    async function autoReconnect() {
      if (!$("autoRefreshToggle").checked || reconnecting || (device && device.opened)) return;
      const now = Date.now();
      if (now - lastReconnectAttempt < 1600) return;
      reconnecting = true;
      lastReconnectAttempt = now;
      try {
        await reuse(true);
      } finally {
        reconnecting = false;
      }
    }

    function applyUsbStatus(data) {
      currentMode = data.output_mode || currentMode || "";
      pendingMode = data.pending_output_mode || currentMode || pendingMode || "";
      restartRequired = !!data.restart_required;
      setText("usbMode", currentMode || "--");
      const pendingText = restartRequired ? ` / pending ${pendingMode} / restart required` : "";
      setText("usbDetail", `mounted ${boolText(data.usb_mounted)} / suspended ${boolText(data.usb_suspended)} / ${number(data.usb_submit_hz)}→${number(data.usb_complete_hz)} Hz${pendingText}`);
      setText("rumbleState", data.rumble_enabled ? (data.rumble_active ? "active" : "enabled") : "off");
      setText("rumbleDetail", `writes ${number(data.rumble_writes)} / errors ${number(data.rumble_errors)} / ${data.rumble_last_source || "none"} / audio ${number(data.audio_out_packets)}`);
      $("rateInput").value = number(data.report_rate_hz, $("rateInput").value);
      $("scaleInput").value = number(data.rumble_scale_percent, $("scaleInput").value);
      $("holdInput").value = number(data.rumble_hold_ms, $("holdInput").value);
      $("tickInput").value = number(data.rumble_tick_ms, $("tickInput").value);
      $("rawToggle").checked = !!data.usb_raw_passthrough;
      $("parseToggle").checked = !!data.web_parse_reports;
      updateModeButtons();
    }

    function applyBleStatus(data) {
      setText("bleState", data.state || "--");
      const name = data.last_name || "unknown";
      setText("bleDetail", `${name} / RSSI ${number(data.rssi)} / notify ${number(data.notify_hz)} Hz / age ${number(data.last_notify_age_ms)} ms`);
    }

    function setStick(dotId, titleId, x, y, prefix) {
      const nx = clamp(number(x, 2048) / 4095, 0, 1);
      const ny = 1 - clamp(number(y, 2048) / 4095, 0, 1);
      $(dotId).style.left = `${nx * 100}%`;
      $(dotId).style.top = `${ny * 100}%`;
      setText(titleId, `${prefix} ${number(x, 2048)} / ${number(y, 2048)}`);
    }

    function renderButtons(buttons) {
      const value = number(buttons);
      for (const el of $("buttonMap").children) {
        const bit = Number(el.dataset.bit);
        el.classList.toggle("on", (value & (1 << bit)) !== 0);
      }
    }

    function applyInputStatus(data) {
      setStick("leftDot", "leftStickText", data.lx, data.ly, "L");
      setStick("rightDot", "rightStickText", data.rx, data.ry, "R");
      renderButtons(data.buttons);
      setText("inputDetail", `${data.kind || "--"} len ${number(data.len)} updates ${number(data.updates)} raw ${data.raw_head || ""}`);
      applyBatteryStatus(data);
    }

    function applyBatteryStatus(data) {
      if (data.battery_valid) {
        setText("batteryValue", `${number(data.battery_percent)}%`);
      } else {
        setText("batteryValue", "未知");
      }
      const raw = Number.isFinite(Number(data.battery_raw)) ? `0x${number(data.battery_raw).toString(16).padStart(2, "0")}` : "--";
      const offset = number(data.battery_offset, 255);
      setText("batteryDetail", `offset ${offset === 255 ? "--" : offset} / raw ${raw} / charging ${boolText(data.battery_charging)} / head ${data.raw_head || "--"}`);
    }

    function handleInputReport(event) {
      if (event.reportId !== INPUT_REPORT_ID) return;
      const data = new Uint8Array(event.data.buffer, event.data.byteOffset, event.data.byteLength);
      if (data.length < 16) return;

      liveInputCount++;
      lastLiveInputMs = performance.now();
      pendingLiveInput = {
        lx: unpack12X(data, 10),
        ly: unpack12Y(data, 10),
        rx: unpack12X(data, 13),
        ry: unpack12Y(data, 13),
        buttons: buttonsFromNintendoReport(data),
        rawButtons: readLe32(data, 4),
        counter: data[0],
        len: data.length,
      };
      if (!liveFrameQueued) {
        liveFrameQueued = true;
        requestAnimationFrame(renderLiveInput);
      }
    }

    function renderLiveInput() {
      liveFrameQueued = false;
      const input = pendingLiveInput;
      if (!input) return;
      setStick("leftDot", "leftStickText", input.lx, input.ly, "L");
      setStick("rightDot", "rightStickText", input.rx, input.ry, "R");
      renderButtons(input.buttons);
      const seconds = Math.max(0.001, (performance.now() - liveInputStartMs) / 1000);
      const hz = Math.round(liveInputCount / seconds);
      setText("inputDetail", `USB input report ${input.len}B #${liveInputCount} ~${hz}Hz buttons 0x${input.rawButtons.toString(16).padStart(8, "0")}`);
    }

    function updateModeButtons() {
      for (const btn of document.querySelectorAll(".mode-btn")) {
        btn.classList.toggle("active", btn.dataset.mode === currentMode);
        btn.classList.toggle("pending", restartRequired && btn.dataset.mode === pendingMode);
      }
      const color = currentMode === "dualsense" ? "blue" : currentMode === "xinput" ? "green" : currentMode === "nintendo" ? "red" : "";
      $("hidDot").className = `dot ${device && device.opened ? color || "ok" : "bad"}`;
    }

    async function refreshAll(verbose = true, includeInputSnapshot = false) {
      if (!device || !device.opened) {
        await autoReconnect();
        return;
      }
      try {
        const usb = await sendCommand("usb status", true);
        if (usb.ok) applyUsbStatus(usb);
        const ble = await sendCommand("status", true);
        if (ble.ok) applyBleStatus(ble);
        if (includeInputSnapshot) {
          const input = await sendCommand("motion status", true);
          if (input.ok) applyInputStatus(input);
        }
        if (verbose) log("状态已刷新");
      } catch (error) {
        log(`刷新失败: ${error.message}`);
      }
    }

    async function applyUsbSettings() {
      const commands = [
        `usb rate ${clamp(number($("rateInput").value, 250), 1, 1000)}`,
        $("rawToggle").checked ? "usb raw on" : "usb raw off",
        $("parseToggle").checked ? "web parse on" : "web parse off",
      ];
      for (const cmd of commands) await sendCommand(cmd);
      await refreshAll(false);
    }

    async function applyRumbleSettings() {
      const scale = clamp(number($("scaleInput").value, 60), 0, 100);
      const hold = clamp(number($("holdInput").value, 140), 20, 2000);
      const tick = clamp(number($("tickInput").value, 12), 4, 100);
      await sendCommand(`rumble tune ${scale} ${hold} ${tick} 3`);
      await refreshAll(false);
    }

    async function setMode(mode) {
      const data = await sendCommand(`usb mode ${mode}`);
      if (data && data.ok) applyUsbStatus(data);
      updateModeButtons();
      log(`模式已保存为 ${mode}，当前仍是 ${currentMode || "--"}，点“重启USB”后重新枚举`);
    }

    function buildButtonMap() {
      const root = $("buttonMap");
      root.textContent = "";
      buttonNames.forEach((name, bit) => {
        const el = document.createElement("div");
        el.className = "key";
        el.dataset.bit = String(bit);
        el.textContent = name;
        root.appendChild(el);
      });
    }

    function installEvents() {
      $("connectBtn").addEventListener("click", connect);
      $("reuseBtn").addEventListener("click", reuse);
      $("refreshBtn").addEventListener("click", () => refreshAll(true, true));
      $("saveBtn").addEventListener("click", () => sendCommand("settings save").then(() => refreshAll(false)).catch((e) => log(e.message)));
      $("restartBtn").addEventListener("click", () => sendCommand("usb reboot").catch((e) => log(e.message)));
      $("applyUsbBtn").addEventListener("click", () => applyUsbSettings().catch((e) => log(`应用USB失败: ${e.message}`)));
      $("applyRumbleBtn").addEventListener("click", () => applyRumbleSettings().catch((e) => log(`应用震动失败: ${e.message}`)));
      $("rumbleOnBtn").addEventListener("click", () => sendCommand("rumble on").then(() => refreshAll(false)).catch((e) => log(e.message)));
      $("rumbleOffBtn").addEventListener("click", () => sendCommand("rumble off").then(() => refreshAll(false)).catch((e) => log(e.message)));
      $("manualRumbleBtn").addEventListener("click", () => {
        const l = clamp(number($("manualLeft").value), 0, 255);
        const r = clamp(number($("manualRight").value), 0, 255);
        const h = clamp(number($("manualHold").value), 20, 2000);
        sendCommand(`rumble motors ${l} ${r} ${h}`).then(() => refreshAll(false)).catch((e) => log(e.message));
      });
      $("sendBtn").addEventListener("click", () => {
        sendCommand($("commandInput").value).catch((e) => log(`命令失败: ${e.message}`));
      });
      $("commandInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("sendBtn").click();
      });
      for (const btn of document.querySelectorAll("[data-cmd]")) {
        btn.addEventListener("click", () => sendCommand(btn.dataset.cmd).then(() => refreshAll(false, false)).catch((e) => log(e.message)));
      }
      for (const btn of document.querySelectorAll("[data-quick]")) {
        btn.addEventListener("click", () => {
          $("commandInput").value = btn.dataset.quick;
          $("sendBtn").click();
        });
      }
      for (const btn of document.querySelectorAll(".mode-btn")) {
        btn.addEventListener("click", () => setMode(btn.dataset.mode).catch((e) => log(`切换模式失败: ${e.message}`)));
      }
      $("autoRefreshToggle").addEventListener("change", setupRefreshTimer);
    }

    function setupRefreshTimer() {
      clearInterval(refreshTimer);
      refreshTimer = 0;
      if ($("autoRefreshToggle").checked) {
        refreshTimer = setInterval(() => refreshAll(false), 5000);
      }
    }

    async function boot() {
      if (!("hid" in navigator)) {
        log("当前浏览器不支持 WebHID，请用 Chrome/Edge 打开。");
        return;
      }
      buildButtonMap();
      installEvents();
      setHidState(false);
      setupRefreshTimer();
      await reuse();
    }

    boot();
  </script>
</body>
</html>
